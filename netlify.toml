[build.environment]
  NPM_FLAGS = "--legacy-peer-deps --force"

# NO habilitar el plugin "Minify HTML" (netlify-plugin-minify-html) en la UI.
#
# Ese plugin corre sobre las paginas estaticas del deploy y les saca las
# comillas de los atributos: og:image queda como
#   <meta property=og:image content=https://sacaturno.com.ar/og-sacaturno.png>
# El scraper de WhatsApp ignora los atributos sin comillas, asi que el link se
# comparte sin miniatura. og:title y og:description sobreviven solo porque sus
# valores tienen espacios y el minificador se ve obligado a comillarlos.
#
# Verificado en produccion: las paginas estaticas salian minificadas y sin
# preview, las SSR (/[slug]) salian intactas y con imagen.
#
# El plugin se instala desde la UI y no deja rastro en el repo, de ahi este
# comentario.
